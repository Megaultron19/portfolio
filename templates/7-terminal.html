<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Name — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b0f0c; --win:#111813; --fg:#c8f7d0; --muted:#6b8f72; --green:#4ade80; --amber:#fbbf24; --blue:#60a5fa; --pink:#f472b6; --line:#1f2e23; }
  * { box-sizing:border-box; margin:0; }
  body { font:15px/1.65 "Fira Code", ui-monospace, monospace; color:var(--fg); background:var(--bg); min-height:100vh; display:grid; place-items:center; padding:20px; }
  body::before { content:""; position:fixed; inset:0; pointer-events:none; background:repeating-linear-gradient(transparent 0 2px, rgba(0,0,0,.25) 2px 3px); z-index:5; }
  .win { width:min(900px, 100%); height:min(640px, calc(100vh - 40px)); background:var(--win); border:1px solid var(--line); border-radius:12px; box-shadow:0 0 0 1px #000, 0 30px 80px rgba(0,0,0,.6), 0 0 60px rgba(74,222,128,.08); display:flex; flex-direction:column; overflow:hidden; }
  .bar { display:flex; align-items:center; gap:8px; padding:12px 16px; border-bottom:1px solid var(--line); color:var(--muted); font-size:13px; }
  .bar i { width:12px; height:12px; border-radius:50%; background:#ff5f57; }
  .bar i:nth-child(2) { background:#febc2e; } .bar i:nth-child(3) { background:#28c840; margin-right:10px; }
  #out { flex:1; overflow-y:auto; padding:18px 20px; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  #out div { white-space:pre-wrap; word-break:break-word; }
  .p { color:var(--green); } .a { color:var(--amber); } .b { color:var(--blue); } .k { color:var(--pink); } .m { color:var(--muted); }
  a { color:var(--blue); }
  .ascii { color:var(--green); text-shadow:0 0 8px rgba(74,222,128,.5); font-size:clamp(6px, 1.6vw, 13px); line-height:1.3; margin-bottom:10px; }
  @media (max-width:600px) { body { font-size:13px; padding:10px; } .win { height:calc(100vh - 20px); } }
  .row { display:flex; gap:8px; padding:0 20px 16px; }
  #cmd { flex:1; background:none; border:0; outline:0; color:var(--fg); font:inherit; caret-color:var(--green); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; padding:10px 20px; border-top:1px solid var(--line); }
  .chips button { font:inherit; font-size:12px; color:var(--muted); background:none; border:1px solid var(--line); border-radius:6px; padding:3px 10px; cursor:pointer; }
  .chips button:hover { color:var(--green); border-color:var(--green); }
</style>
</head>
<body>
<div class="win" onclick="cmd.focus()">
  <div class="bar"><i></i><i></i><i></i>yourname@portfolio: ~</div>
  <div id="out" aria-live="polite"></div>
  <form class="row" id="f"><span class="p">➜ ~</span><input id="cmd" autocomplete="off" spellcheck="false" aria-label="Type a command" autofocus></form>
  <div class="chips"></div>
</div>

<script>
  // ponytail: edit content here, everything renders from this object
  const C = {
    about: `<span class="a">Your Name</span> — Software Developer · City, Country
Two or three lines about who you are, what you build, and what you want next.
<span class="p">●</span> Open to opportunities`,
    projects: `<span class="b">01</span> <span class="a">Project One</span>     AI-powered thing that does X.        <span class="m">[React, Node]</span>  <a href="#">↗</a>
<span class="b">02</span> <span class="a">Project Two</span>     Python API framework for Y.          <span class="m">[Python, FastAPI]</span>  <a href="#">↗</a>
<span class="b">03</span> <span class="a">Project Three</span>   Dashboard that tracks Z.             <span class="m">[Next.js, Postgres]</span>  <a href="#">↗</a>`,
    skills: `<span class="k">languages</span>  Python · JavaScript · TypeScript · SQL
<span class="k">frontend</span>   React · Next.js · Tailwind
<span class="k">backend</span>    Node.js · FastAPI · PostgreSQL
<span class="k">tools</span>      Git · Docker · AWS · Linux`,
    experience: `<span class="a">2025 – now</span>   Role @ Company — what you did and the impact.
<span class="a">2021 – 2025</span>  B.Tech Computer Science @ University`,
    contact: `email     <a href="mailto:you@example.com">you@example.com</a>
github    <a href="#">github.com/you</a>
linkedin  <a href="#">linkedin.com/in/you</a>
resume    <a href="#">resume.pdf</a>`,
  };
  const banner = `<div class="ascii"> __   __                 _   _
 \\ \\ / /__  _   _ _ __  | \\ | | __ _ _ __ ___   ___
  \\ V / _ \\| | | | '__| |  \\| |/ _\` | '_ \` _ \\ / _ \\
   | | (_) | |_| | |    | |\\  | (_| | | | | | |  __/
   |_|\\___/ \\__,_|_|    |_| \\_|\\__,_|_| |_| |_|\\___|</div>`;
  const help = () => 'Commands: ' + [...Object.keys(C), 'help', 'clear'].map(k => `<span class="p">${k}</span>`).join('  ');
  const out = document.getElementById('out'), cmd = document.getElementById('cmd');
  const print = h => { const d = document.createElement('div'); d.innerHTML = h; out.append(d); out.scrollTop = out.scrollHeight; };
  const run = c => {
    c = c.trim().toLowerCase(); print(`<span class="p">➜ ~</span> ${c.replace(/</g, '&lt;')}`);
    if (c === 'clear') return out.innerHTML = '';
    print(c === 'help' ? help() : C[c] ?? (c ? `<span class="k">command not found:</span> ${c.replace(/</g, '&lt;')}. Try <span class="p">help</span>.` : ''));
    print('&nbsp;');
  };
  document.getElementById('f').onsubmit = e => { e.preventDefault(); run(cmd.value); cmd.value = ''; };
  document.querySelector('.chips').innerHTML = [...Object.keys(C), 'clear'].map(k => `<button type="button">${k}</button>`).join('');
  document.querySelector('.chips').onclick = e => e.target.tagName === 'BUTTON' && run(e.target.textContent);
  print(banner); print(C.about); print('&nbsp;'); print(help()); print('&nbsp;');
</script>
</body>
</html>
